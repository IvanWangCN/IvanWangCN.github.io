<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">MyHome</div>
            <ul class="nav-menu">
                <li><a href="#home">首页</a></li>
                <li><a href="#about">关于我</a></li>
                <li><a href="#skill">技能</a></li>
                <li><a href="#project">项目</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
            <button class="dark-btn" id="toggleDark">🌙</button>
        </div>
    </nav>

    <!-- 首页横幅 -->
    <section id="home" class="hero">
        <div class="hero-content">
            <img src="./assets/avatar.jpg" alt="头像" class="avatar">
            <h1>你好，我是XXX</h1>
            <p class="subtitle">前端爱好者｜手写原生页面｜喜欢折腾</p>
            <div class="social-links">
                <a href="https://github.com/你的用户名" target="_blank">GitHub</a>
                <a href="#" target="_blank">Blog</a>
                <a href="mailto:xxx@xxx.com">Email</a>
            </div>
        </div>
    </section>

    <!-- 关于我 -->
    <section id="about" class="section">
        <h2>关于我</h2>
        <div class="container">
            <p>这里写自我介绍，兴趣、经历，随便改。</p>
            <p>这个页面完全原生 HTML + CSS + JS，无任何框架，托管在 GitHub Pages。</p>
        </div>
    </section>

    <!-- 技能 -->
    <section id="skill" class="section bg-gray">
        <h2>技能</h2>
        <div class="container skill-grid">
            <div class="skill-card">HTML</div>
            <div class="skill-card">CSS</div>
            <div class="skill-card">JavaScript</div>
            <div class="skill-card">Git</div>
        </div>
    </section>

    <!-- 项目 -->
    <section id="project" class="section">
        <h2>项目</h2>
        <div class="container project-grid">
            <div class="project-card">
                <h3>项目1</h3>
                <p>项目描述</p>
                <a href="https://github.com/xxx/xxx" target="_blank">查看仓库</a>
            </div>
            <div class="project-card">
                <h3>项目2</h3>
                <p>项目描述</p>
                <a href="#" target="_blank">查看链接</a>
            </div>
        </div>
    </section>

    <!-- 联系 -->
    <section id="contact" class="section bg-gray">
        <h2>联系我</h2>
        <div class="container">
            <p>邮箱：xxx@xxx.com</p>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 我的个人主页 | 原生手写，托管于 GitHub Pages</p>
    </footer>

    <script src="./main.js"></script>
</body>
</html>
